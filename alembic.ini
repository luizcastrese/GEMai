[alembic]
script_location = migrations
prepend_sys_path = .
# A URL do banco vem de ERP_DATABASE_URL (veja migrations/env.py).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
